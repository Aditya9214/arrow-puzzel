plugins {
    id 'com.android.application'
}

android {
    namespace 'com.painfullgames.freepath'
    compileSdk 36

    defaultConfig {
        applicationId 'com.painfullgames.freepath'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-ads:25.5.0'
}
