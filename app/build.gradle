plugins {
    id 'com.android.application'
}

android {
    namespace 'com.painfullgames.freepath'
    compileSdk 36

    defaultConfig {
        applicationId 'com.painfullgames.freepath'
        minSdk 24
        targetSdk 35
        versionCode 4
        versionName '1.3'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Fixed debug key so every CI build can update the previous install.
    // Debug-only signing material: never use this key for a Play Store release.
    signingConfigs {
        debug {
            storeFile rootProject.file('app/ci-debug-key.p12')
            storeType 'pkcs12'
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-ads:25.5.0'
}
