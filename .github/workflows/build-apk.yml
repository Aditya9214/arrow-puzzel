name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # ubuntu-latest is migrating to Ubuntu 26 (Oct 2026); pin a known-good image.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's Ubuntu runners already ship an Android SDK. Installing the
      # packages we need with sdkmanager is more reliable than the
      # android-actions/setup-android action, which failed on every past run.
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_HOME:-}" ]; then
            for d in /usr/local/lib/android/sdk "$HOME/Android/Sdk"; do
              if [ -d "$d" ]; then export ANDROID_HOME="$d"; break; fi
            done
          fi
          SDK="${ANDROID_HOME:?Android SDK not found on this runner}"
          export ANDROID_SDK_ROOT="$SDK"
          echo "Using Android SDK at $SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SM" ]; then SM="$(command -v sdkmanager || true)"; fi
          if [ -z "$SM" ]; then
            echo "::error title=Android SDK::sdkmanager not found in $SDK"
            exit 1
          fi
          echo "sdkmanager: $SM"

          yes | timeout 240 "$SM" --licenses > /tmp/sdk-licenses.log 2>&1 || true

          set +e
          "$SM" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" > /tmp/sdk.log 2>&1
          code=$?
          set -e
          tail -n 30 /tmp/sdk.log
          if [ $code -ne 0 ]; then
            msg=$(tail -n 20 /tmp/sdk.log | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Android SDK install failed::$msg"
            exit $code
          fi

      - name: Build debug APK
        shell: bash
        run: |
          set +e
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace > build.log 2>&1
          code=$?
          set -e
          tail -n 60 build.log
          if [ $code -ne 0 ]; then
            msg=$(grep -A 12 -E "What went wrong|error:|FAILURE" build.log | head -40 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Gradle failure::$msg"
          fi
          exit $code

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FreePath-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Keep a public download URL that needs no GitHub login:
      # https://github.com/Aditya9214/arrow-puzzel/releases/download/debug-latest/FreePath-debug.apk
      - name: Publish APK to rolling release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk FreePath-debug.apk
          tag="debug-latest"
          gh release delete "$tag" --yes --cleanup-tag > /dev/null 2>&1 || true
          gh release create "$tag" FreePath-debug.apk \
            --title "Free Path - latest debug APK" \
            --notes "Build ${{ github.run_number }} from ${GITHUB_SHA:0:7}. Debug-signed: uninstall any older copy before installing."
